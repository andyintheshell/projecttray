<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>ProjectTray</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="backdrop" id="backdrop">
      <main class="panel" id="panel" role="dialog" aria-modal="true" aria-label="ProjectTray projects">
        <header class="topbar">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true">
              <span></span><span></span><span></span><span></span>
            </span>
            <span class="brand-name">ProjectTray</span>
          </div>

          <div class="top-actions">
            <span class="save-status" id="save-status">
              <span class="save-dot" aria-hidden="true"></span>
              <span id="save-label">Saved</span>
            </span>
            <button class="btn primary" data-action="new-project" type="button">
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M8 3.25v9.5M3.25 8h9.5" />
              </svg>
              New project
            </button>
            <button
              class="icon-btn theme-btn"
              id="theme-toggle"
              type="button"
              aria-label="Switch to light mode"
              title="Toggle light mode"
            >
              <svg class="theme-icon sun-icon" viewBox="0 0 16 16" aria-hidden="true">
                <circle cx="8" cy="8" r="2.9" />
                <path d="M8 1.6v1.3M8 13.1v1.3M1.6 8h1.3M13.1 8h1.3M3.5 3.5l.9.9M11.6 11.6l.9.9M12.5 3.5l-.9.9M4.4 11.6l-.9.9" />
              </svg>
              <svg class="theme-icon moon-icon" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M13.35 9.72A5.9 5.9 0 0 1 6.28 2.65a5.9 5.9 0 1 0 7.07 7.07Z" />
              </svg>
            </button>
            <button
              class="icon-btn settings-btn"
              id="settings-toggle"
              type="button"
              aria-label="Backup settings"
              title="Backup settings"
              data-popover-anchor
            >
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M2.5 5h11M2.5 11h11" />
                <circle cx="6" cy="5" r="1.6" fill="currentColor" stroke="none" />
                <circle cx="10" cy="11" r="1.6" fill="currentColor" stroke="none" />
              </svg>
            </button>
            <button class="icon-btn close-btn" data-action="close" type="button" aria-label="Close overlay">
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="m4 4 8 8M12 4l-8 8" />
              </svg>
            </button>
          </div>
        </header>

        <section class="intro">
          <div class="intro-copy">
            <p class="eyebrow">
              <span id="today-label">Today</span>
              <span class="eyebrow-sep">·</span>
              <span id="project-summary">No projects</span>
            </p>
            <h1>What needs <em>your attention?</em></h1>
          </div>

          <div class="summary" aria-label="Overview">
            <div class="stat">
              <strong id="open-count">0</strong>
              <span>next actions</span>
            </div>
            <div class="stat is-accent">
              <strong id="due-count">0</strong>
              <span>due soon</span>
            </div>
          </div>
        </section>

        <section class="project-grid" id="project-grid" aria-label="Projects"></section>

        <footer class="footer">
          <span class="footer-note">
            <span class="privacy-dot" aria-hidden="true"></span>
            Stored locally on this Mac
          </span>
          <span class="footer-keys">
            <kbd>⌘</kbd><kbd>N</kbd> new project
            <span class="key-sep">·</span>
            <kbd>Esc</kbd> close
          </span>
        </footer>
      </main>
    </div>

    <div class="popover-layer" id="popover-layer"></div>

    <div class="toast" id="toast" role="status" aria-live="polite">
      <span class="toast-icon" aria-hidden="true">
        <svg viewBox="0 0 16 16"><path d="M3.5 8.25 6.5 11l6-6.5" /></svg>
      </span>
      <span id="toast-message">Done</span>
      <button class="toast-action" id="toast-action" type="button">Undo</button>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
